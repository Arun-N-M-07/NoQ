# Optional demo profile: in-memory H2 database (MySQL compatibility mode) - no MySQL installation needed.
# Run with:  ./mvnw -pl noq-app spring-boot:run -Dspring-boot.run.profiles=h2
# Data is lost when the application stops. Tests also use this profile.
spring.datasource.url=jdbc:h2:mem:noq;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
