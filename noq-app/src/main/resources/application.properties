# ============================================================
# NoQ main application (port 8080)
# Secrets come from environment variables or a local .env file
# (copy .env.example to .env - .env is git-ignored).
# ============================================================
spring.application.name=noq
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

# ---------- MySQL 8 ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/noq_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
# update = Hibernate creates/updates tables from the @Entity classes (see docs/schema-mysql.sql for the DDL)
spring.jpa.hibernate.ddl-auto=update
# Lazy loading only inside @Transactional service methods (no DB access while rendering views)
spring.jpa.open-in-view=false
# Load order items of many orders in one query instead of one query per order (avoids "N+1")
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Set to true to SEE every SQL statement Hibernate runs (handy to prove cache hits skip the DB)
spring.jpa.show-sql=false

# ---------- Sample data ----------
# data.sql runs after Hibernate has created the tables; INSERT IGNORE keeps existing rows untouched
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------- Caching (Caffeine) ----------
spring.cache.type=caffeine
spring.cache.cache-names=menu,popularItems
# recordStats -> hit/miss counts visible at /actuator/metrics/cache.gets
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=60s,recordStats

# ---------- Web ----------
server.servlet.session.cookie.same-site=lax
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,caches,metrics
management.endpoint.health.show-details=when-authorized

# ---------- NoQ settings ----------
noq.canteen.opens-at=08:00
noq.canteen.closes-at=18:00
# true = counter-payment orders must be paid before staff can confirm them
noq.orders.require-payment-before-confirm=false
# Unpaid ONLINE orders are cancelled (stock returned) after this long; checked every expiry-check-interval
noq.orders.online-payment-timeout=15m
noq.orders.expiry-check-interval=PT1M
noq.notification.base-url=${NOTIFICATION_URL:http://localhost:8081}

logging.level.com.noq=INFO
