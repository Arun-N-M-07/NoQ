<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: pageHead('Orders')}"></head>
<body class="staff">
<header th:replace="~{fragments :: staffHeader('orders')}"></header>

<main class="container orders-page">
    <div class="page-title">
        <h1>Ready for pickup</h1>
        <p class="poll-note"><span class="live-dot"></span> <span data-updated>Loading…</span></p>
    </div>
    <!-- Orders the kitchen marked READY_FOR_PICKUP (oldest first): staff.js -> GET /api/orders?status=READY_FOR_PICKUP -->
    <div class="orders-list" data-orders data-mode="staff"></div>
</main>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/staff.js}"></script>
</body>
</html>
