<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: pageHead('Menu management')}"></head>
<body class="staff">
<header th:replace="~{fragments :: staffHeader('menu')}"></header>

<main class="container">
    <div class="staff-toolbar">
        <h1 style="font-size:1.5rem">Menu management</h1>
        <a class="btn btn-primary" th:href="@{/staff/menu/new}">+ Add item</a>
    </div>
    <div class="alert alert-ok" th:if="${message}" th:text="${message}"></div>

    <div class="card table-wrap">
        <table class="data">
            <thead>
            <tr><th></th><th>Item</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}" th:classappend="${item.active} ? '' : 'inactive'">
                <td>
                    <div class="thumb">
                        <img th:if="${item.imageUrl}" th:src="${item.imageUrl}" alt="" loading="lazy" th:attr="data-fallback=${item.categoryEmoji}">
                        <div th:unless="${item.imageUrl}" class="img-fallback" th:text="${item.categoryEmoji}"></div>
                    </div>
                </td>
                <td><b th:text="${item.name}">Name</b><br>
                    <span class="muted small" th:text="|${item.categoryLabel} · ordered ${item.popularityCount}×|"></span></td>
                <td th:text="|₹${item.price}|">₹0</td>
                <td>
                    <form class="inline-form" th:action="@{/staff/menu/{id}/availability(id=${item.id})}" method="post">
                        <input class="input" type="number" name="availableQuantity" min="0" max="10000" required
                               th:value="${item.availableQuantity}" th:aria-label="|Stock for ${item.name}|">
                        <button class="btn btn-sm" type="submit">Save</button>
                    </form>
                </td>
                <td>
                    <span th:if="${!item.active}" class="pill">Inactive</span>
                    <span th:if="${item.active and item.orderable}" class="pill pill-ok">On sale</span>
                    <span th:if="${item.active and !item.available}" class="pill pill-bad">Marked sold out</span>
                    <span th:if="${item.active and item.available and item.availableQuantity == 0}" class="pill pill-warn">Out of stock</span>
                </td>
                <td style="white-space:nowrap">
                    <a class="btn btn-sm" th:href="@{/staff/menu/{id}/edit(id=${item.id})}">Edit</a>
                    <form class="inline-form" th:action="@{/staff/menu/{id}/availability(id=${item.id})}" method="post">
                        <input type="hidden" name="available" th:value="${!item.available}">
                        <button class="btn btn-sm" type="submit" th:text="${item.available} ? 'Mark sold out' : 'Back on sale'">Sold out</button>
                    </form>
                    <form class="inline-form" th:action="@{/staff/menu/{id}/active(id=${item.id})}" method="post">
                        <input type="hidden" name="active" th:value="${!item.active}">
                        <button class="btn btn-sm" th:classappend="${item.active} ? 'btn-danger' : ''" type="submit"
                                th:text="${item.active} ? 'Deactivate' : 'Reactivate'">Deactivate</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
