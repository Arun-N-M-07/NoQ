<!DOCTYPE html>
<!-- Reusable page pieces. Other templates include them with th:replace="~{fragments :: name}". -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="pageHead(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#faf8f4">
    <title th:text="${title} + ' · NoQ'">NoQ</title>
    <link rel="icon" th:href="@{/images/favicon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="site-header" th:fragment="siteHeader">
    <div class="container">
        <a class="brand" th:href="@{/}" aria-label="NoQ home">
            <span class="brand-mark">Q</span>
            <span><span class="brand-name">NoQ</span><span class="brand-sub">No Queue. Just Order.</span></span>
        </a>
        <nav class="nav" aria-label="Main">
            <a class="cart-link" th:href="@{/cart}" aria-label="Cart">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h8.1a2 2 0 0 0 2-1.5L21 8H6.2"/></svg>
                <span class="badge-count" data-cart-count>0</span>
            </a>
        </nav>
    </div>
</header>

<header class="staff-header" th:fragment="staffHeader(active)">
    <div class="container">
        <a class="brand" th:href="@{/staff}">
            <span class="brand-mark">Q</span>
            <span><span class="brand-name">NoQ</span><span class="brand-sub">Staff</span></span>
        </a>
        <nav class="nav" aria-label="Staff">
            <a sec:authorize="hasRole('STAFF')" th:href="@{/staff}" th:attr="aria-current=${active == 'orders'} ? 'page' : null">Orders</a>
            <a sec:authorize="hasRole('KITCHEN')" th:href="@{/staff/kitchen}" th:attr="aria-current=${active == 'kitchen'} ? 'page' : null">Kitchen</a>
            <form th:action="@{/staff/logout}" method="post" class="inline-form">
                <button class="link" type="submit">Log out <span class="small" sec:authentication="name"></span></button>
            </form>
        </nav>
    </div>
</header>

<footer class="site-footer" th:fragment="siteFooter">
    <div class="container">
        NoQ · Smart Canteen Pre-Ordering · IT23502 Web Programming mini-project ·
        <a th:href="@{/staff}">Staff login</a>
    </div>
</footer>

</body>
</html>
