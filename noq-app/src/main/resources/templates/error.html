<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: pageHead('Something went wrong')}"></head>
<body>
<header th:replace="~{fragments :: siteHeader}"></header>
<main class="container">
    <div class="card pad empty" style="margin-top:40px">
        <p style="font-size:2.5rem;margin:0">🍽️</p>
        <h1 th:text="${status} ?: 'Error'">404</h1>
        <p th:text="${message != null and message != '' and message != 'No message available'} ? ${message} : 'We could not find that page.'">Not found</p>
        <a class="btn btn-primary" th:href="@{/}">Back to the menu</a>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
