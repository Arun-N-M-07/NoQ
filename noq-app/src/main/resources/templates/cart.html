<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: pageHead('Your cart')}"></head>
<body>
<header th:replace="~{fragments :: siteHeader}"></header>

<main class="container">
    <div class="page-title"><h1>Your cart</h1></div>

    <div class="empty card pad hidden" data-cart-empty>
        <p style="font-size:2.5rem;margin:0">🛒</p>
        <p>Your cart is empty.</p>
        <a class="btn btn-primary" th:href="@{/}">Browse the menu</a>
    </div>

    <div class="checkout hidden" data-checkout>
        <section class="card" aria-label="Items">
            <div data-cart-lines></div>
        </section>

        <aside class="card pad summary" aria-label="Order summary">
            <h2 style="font-size:1.2rem;margin-bottom:10px">Summary</h2>
            <div class="summary-row"><span>Subtotal</span><span data-subtotal>₹0</span></div>
            <div class="summary-row muted small"><span>Taxes &amp; fees</span><span>₹0</span></div>
            <div class="summary-row total"><span>To pay</span><span data-total>₹0</span></div>

            <fieldset class="pay-options" style="border:0;padding:0">
                <legend style="font-weight:800;margin-bottom:8px">Payment method</legend>
                <label class="pay-option">
                    <input type="radio" name="payment" value="PAY_AT_COUNTER" checked>
                    <span><strong>Pay at counter</strong><span class="muted small">Cash or UPI when you collect your food.</span></span>
                </label>
                <label class="pay-option">
                    <input type="radio" name="payment" value="ONLINE">
                    <span><strong>Online payment <span class="pill pill-warn">Demo</span></strong>
                        <span class="muted small">Simulated payment screen - no real money is charged.</span></span>
                </label>
            </fieldset>

            <div class="alert alert-bad hidden" role="alert" data-error></div>
            <button class="btn btn-primary btn-lg btn-block" type="button" data-place-order>Place order</button>
            <p class="muted small" style="margin-bottom:0">Prices and stock are confirmed by the canteen when you place the order.</p>
        </aside>
    </div>
</main>

<footer th:replace="~{fragments :: siteFooter}"></footer>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
