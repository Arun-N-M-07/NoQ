<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: pageHead('Menu')}"></head>
<body>
<header th:replace="~{fragments :: siteHeader}"></header>

<main class="container">
    <!-- Menu -->
    <section id="menu">
        <div class="page-title section-head"><h1>Canteen Menu</h1><span class="muted small" data-result-count></span></div>
        <div class="toolbar">
            <div class="toolbar-row">
                <label class="sr-only" for="search">Search menu</label>
                <input id="search" class="input" type="search" placeholder="Search dosa, coffee, burger…" autocomplete="off">
                <label class="sr-only" for="sort">Sort</label>
                <select id="sort" class="input">
                    <option value="default">Sort: Menu order</option>
                    <option value="popular">Most popular</option>
                    <option value="price-asc">Price: low to high</option>
                    <option value="price-desc">Price: high to low</option>
                    <option value="name">Name A–Z</option>
                </select>
            </div>
            <div class="chips" role="group" aria-label="Category">
                <button class="chip" type="button" data-category="ALL" aria-pressed="true">All</button>
                <button class="chip" type="button" th:each="c : ${categories}" th:attr="data-category=${c.name()}"
                        aria-pressed="false" th:text="${c.label}">Snacks</button>
            </div>
        </div>

        <div class="menu-grid" data-menu-grid>
            <!-- Each card carries its data in data-* attributes so the cart JavaScript can read it -->
            <article th:each="item, stat : ${menu}" class="card menu-card"
                     th:classappend="${item.orderable} ? '' : 'sold-out'"
                     th:attr="data-id=${item.id}, data-name=${item.name}, data-price=${item.price},
                              data-category=${item.category}, data-popularity=${item.popularityCount},
                              data-stock=${item.availableQuantity}, data-orderable=${item.orderable},
                              data-image=${item.imageUrl}, data-emoji=${item.categoryEmoji}, data-order=${stat.index}">
                <div class="thumb">
                    <img th:if="${item.imageUrl}" th:src="${item.imageUrl}" th:alt="${item.name}" loading="lazy"
                         th:attr="data-fallback=${item.categoryEmoji}">
                    <div th:unless="${item.imageUrl}" class="img-fallback" th:text="${item.categoryEmoji}"></div>
                </div>
                <div class="body">
                    <h3 th:text="${item.name}">Name</h3>
                    <p class="desc" th:text="${item.description}"></p>
                    <div class="foot">
                        <span class="price" th:text="|₹${item.price}|">₹0</span>
                        <span class="stock" th:classappend="${item.orderable} ? '' : 'out'"
                              th:text="${item.orderable} ? 'Available' : (${item.available} ? 'Sold out' : 'Not available')">Available</span>
                    </div>
                </div>
                <div data-cart-control>
                    <button th:if="${item.orderable}" class="btn btn-primary btn-sm" type="button"
                            th:attr="data-add=${item.id}" th:aria-label="|Add ${item.name} to cart|">Add</button>
                    <button th:unless="${item.orderable}" class="btn btn-sm" type="button" disabled>Add</button>
                </div>
            </article>
        </div>
        <p class="empty hidden" data-empty>No dishes match your search.</p>
    </section>
    <div class="page-bottom-space"></div>
</main>

<a class="cart-bar hidden" th:href="@{/cart}" data-cart-bar>
    <span><strong data-cart-bar-count>0 items</strong><br><span class="small" data-cart-bar-total>₹0</span></span>
    <span class="btn">View cart →</span>
</a>

<footer th:replace="~{fragments :: siteFooter}"></footer>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/menu.js}"></script>
</body>
</html>
